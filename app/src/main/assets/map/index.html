<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PinPulse Radar Map</title>
  <link rel="stylesheet" href="leaflet.css" />
  <script src="leaflet.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background-color: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0f172a;
    }
    .leaflet-control-attribution {
      display: none !important;
    }
    .leaflet-control-zoom {
      display: none !important;
    }

    /* Avatar Marker Style */
    .pinpulse-marker {
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .pinpulse-marker-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -50%);
    }

    /* Pulse wave for live users */
    .pulse-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.4);
      z-index: 1;
      pointer-events: none;
      animation: pulse-animation 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }
    .pulse-ring.is-self {
      background: rgba(59, 130, 246, 0.45);
    }
    .pulse-ring.offline {
      display: none;
    }
    @keyframes pulse-animation {
      0% {
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 0.8;
      }
      70% {
        transform: translate(-50%, -50%) scale(1.6);
        opacity: 0;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.8);
        opacity: 0;
      }
    }

    /* Circular Avatar */
    .avatar-circle {
      position: relative;
      z-index: 2;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid #10b981; /* Green for live */
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
      background: #252836;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .avatar-circle.is-self {
      border-color: #3b82f6; /* Blue for self */
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.6);
    }
    .avatar-circle.offline {
      border-color: #64748b; /* Slate for offline */
      filter: grayscale(0.5);
    }
    .avatar-circle:active {
      transform: scale(1.15);
    }
    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .avatar-initials {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
    }

    /* Name badge */
    .name-badge {
      position: relative;
      z-index: 3;
      margin-top: 4px;
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.15);
      pointer-events: none;
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }
    .name-badge.is-self {
      border-color: #3b82f6;
      color: #60a5fa;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    var map;
    var markers = {};
    var currentLayer;
    var hasAutoCentered = false;
    var tileLayers = {
      streets: L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        subdomains: ['0', '1', '2', '3'],
        maxZoom: 20
      }),
      satellite: L.tileLayer('https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
        subdomains: ['0', '1', '2', '3'],
        maxZoom: 20
      }),
      hybrid: L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        subdomains: ['0', '1', '2', '3'],
        maxZoom: 20
      }),
      osm: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      })
    };

    function initMap() {
      map = L.map('map', {
        center: [36.8065, 10.1815],
        zoom: 15,
        zoomControl: false
      });

      currentLayer = tileLayers.streets;
      currentLayer.addTo(map);

      // Invalidate size immediately and after layout settles so tiles draw without delay
      setTimeout(function() { if (map) map.invalidateSize(); }, 150);
      setTimeout(function() { if (map) map.invalidateSize(); }, 600);

      map.on('click', function(e) {
        if (window.AndroidBridge && window.AndroidBridge.onMapClicked) {
          window.AndroidBridge.onMapClicked();
        }
      });

      if (window.AndroidBridge && window.AndroidBridge.onMapReady) {
        window.AndroidBridge.onMapReady();
      }
    }

    window.resizeMap = function() {
      if (map) map.invalidateSize();
    };

    function setMapStyle(styleKey) {
      if (tileLayers[styleKey]) {
        map.removeLayer(currentLayer);
        currentLayer = tileLayers[styleKey];
        currentLayer.addTo(map);
      }
    }

    function createMarkerHtml(user) {
      var isSelfClass = user.isSelf ? ' is-self' : '';
      var isOfflineClass = (!user.isLive || !user.isSharingLocation) ? ' offline' : '';
      
      var avatarContent = '';
      if (user.avatar && user.avatar.length > 10) {
        avatarContent = '<img src="' + user.avatar + '" alt="" />';
      } else {
        var initial = (user.name && user.name.length > 0) ? user.name.charAt(0).toUpperCase() : '?';
        avatarContent = '<span class="avatar-initials">' + initial + '</span>';
      }

      var displayName = user.name || 'Friend';
      if (user.isSelf) {
        displayName = user.name + ' (You)';
      }

      var html = '<div class="pinpulse-marker-wrapper">' +
                   '<div class="pulse-ring' + isSelfClass + isOfflineClass + '"></div>' +
                   '<div class="avatar-circle' + isSelfClass + isOfflineClass + '">' +
                     avatarContent +
                   '</div>' +
                   '<div class="name-badge' + isSelfClass + '">' + displayName + '</div>' +
                 '</div>';
      return html;
    }

    function updateUserMarker(userJson) {
      try {
        var user = (typeof userJson === 'string') ? JSON.parse(userJson) : userJson;
        if (!user || !user.id || user.lat === undefined || user.lng === undefined) return;

        var lat = parseFloat(user.lat);
        var lng = parseFloat(user.lng);
        if (isNaN(lat) || isNaN(lng) || (lat === 0 && lng === 0)) return;

        var userId = user.id;

        var customIcon = L.divIcon({
          className: 'pinpulse-marker',
          html: createMarkerHtml(user),
          iconSize: [60, 75],
          iconAnchor: [30, 35]
        });

        if (markers[userId]) {
          markers[userId].setIcon(customIcon);
          markers[userId].setLatLng([lat, lng]);
        } else {
          var marker = L.marker([lat, lng], { icon: customIcon });
          marker.on('click', function(e) {
            L.DomEvent.stopPropagation(e);
            if (window.AndroidBridge && window.AndroidBridge.onAvatarClicked) {
              window.AndroidBridge.onAvatarClicked(userId);
            }
          });
          marker.addTo(map);
          markers[userId] = marker;
        }

        // Auto-center on self GPS location if not yet centered!
        if (user.isSelf && !hasAutoCentered && lat !== 0 && lng !== 0) {
          map.setView([lat, lng], 16);
          hasAutoCentered = true;
          if (map) map.invalidateSize();
        }
      } catch (err) {
        console.error("Error updating marker: " + err);
      }
    }

    function removeUserMarker(userId) {
      if (markers[userId]) {
        map.removeLayer(markers[userId]);
        delete markers[userId];
      }
    }

    function clearAllMarkers() {
      for (var id in markers) {
        map.removeLayer(markers[id]);
      }
      markers = {};
    }

    function centerOn(lat, lng, zoomLevel) {
      if (!map) return;
      var z = zoomLevel || map.getZoom() || 16;
      map.flyTo([parseFloat(lat), parseFloat(lng)], z, {
        duration: 1.2,
        easeLinearity: 0.25
      });
      map.invalidateSize();
    }

    window.addEventListener('DOMContentLoaded', initMap);
  </script>
</body>
</html>
