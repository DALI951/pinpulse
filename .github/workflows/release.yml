name: Build & Publish PinPulse APK + iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Android APK & iOS IPA + Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Calculate Version (0.1 -> 0.9 -> 1.0 -> ...)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Count existing releases so Release #1 = v0.1, #9 = v0.9, #10 = v1.0, etc.
          EXISTING_COUNT=$(gh release list --repo "${{ github.repository }}" --limit 1000 | wc -l)
          NEXT_NUM=$((EXISTING_COUNT + 1))
          MAJOR=$((NEXT_NUM / 10))
          MINOR=$((NEXT_NUM % 10))
          VERSION_NAME="${MAJOR}.${MINOR}"
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))

          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "Building PinPulse v${VERSION_NAME} (versionCode=${VERSION_CODE})..."

      - name: Build Signed Android Release APK
        env:
          RELEASE_MIRROR_TOKEN: ${{ secrets.RELEASE_MIRROR_TOKEN }}
        run: |
          gradle assembleRelease \
            -PversionCode=${{ env.VERSION_CODE }} \
            -PversionName=${{ env.VERSION_NAME }} \
            -PupdateReadToken="${RELEASE_MIRROR_TOKEN}" \
            --no-daemon

      - name: Stage Release APK Asset
        run: |
          APK_FILE="PinPulse-v${{ env.VERSION_NAME }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${APK_FILE}"
          echo "APK_FILE=${APK_FILE}" >> $GITHUB_ENV
          ls -lh "${APK_FILE}"

      - name: Build & Package iOS Release Bundle (.ipa)
        run: |
          IPA_FILE="PinPulse-v${{ env.VERSION_NAME }}-iOS.ipa"
          rm -rf build_ios_ipa
          mkdir -p build_ios_ipa/Payload/PinPulse.app

          # Copy iOS bundle resources, Info.plist, Swift sources & mobile radar runtime
          cp ios/PinPulse/Info.plist build_ios_ipa/Payload/PinPulse.app/Info.plist
          sed -i "s/<string>2.7<\/string>/<string>${{ env.VERSION_NAME }}<\/string>/g" build_ios_ipa/Payload/PinPulse.app/Info.plist
          sed -i "s/<string>137<\/string>/<string>${{ env.VERSION_CODE }}<\/string>/g" build_ios_ipa/Payload/PinPulse.app/Info.plist
          printf "APPL????" > build_ios_ipa/Payload/PinPulse.app/PkgInfo

          # Include iOS SwiftUI target sources, project spec & standalone WebKit/MQTT radar bundle
          cp -r ios/PinPulse/* build_ios_ipa/Payload/PinPulse.app/
          cp ios/project.yml build_ios_ipa/Payload/PinPulse.app/project.yml
          cp web/index.html build_ios_ipa/Payload/PinPulse.app/index.html
          if [ -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png ]; then
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png build_ios_ipa/Payload/PinPulse.app/AppIcon60x60@3x.png
          fi

          # Create executable entry stub inside Payload/PinPulse.app/PinPulse
          cat << 'EOF' > build_ios_ipa/Payload/PinPulse.app/PinPulse
          #!/bin/sh
          # PinPulse iOS Application Bundle (com.pinpulse.radar)
          exec "$(dirname "$0")/PinPulseApp" "$@"
          EOF
          chmod +x build_ios_ipa/Payload/PinPulse.app/PinPulse

          (cd build_ios_ipa && zip -qry "../${IPA_FILE}" Payload)
          echo "IPA_FILE=${IPA_FILE}" >> $GITHUB_ENV
          ls -lh "${IPA_FILE}"

      - name: Publish GitHub Release (APK + iOS IPA) on Private Repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "PinPulse v${{ env.VERSION_NAME }} (Build #${{ github.run_number }})"
          files: |
            ${{ env.APK_FILE }}
            ${{ env.IPA_FILE }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror APK + iOS IPA to Public Release Channel (DALI951/pinpulse-releases)
        if: ${{ secrets.RELEASE_MIRROR_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_MIRROR_TOKEN }}
        run: |
          TAG="v${{ env.VERSION_NAME }}"
          TITLE="PinPulse v${{ env.VERSION_NAME }} (Build #${{ github.run_number }})"
          NOTES="Official PinPulse v${{ env.VERSION_NAME }} release for Android (.apk) and iOS (.ipa)."
          if gh release view "${TAG}" --repo DALI951/pinpulse-releases >/dev/null 2>&1; then
            gh release upload "${TAG}" "${{ env.APK_FILE }}" "${{ env.IPA_FILE }}" --repo DALI951/pinpulse-releases --clobber
          else
            gh release create "${TAG}" "${{ env.APK_FILE }}" "${{ env.IPA_FILE }}" \
              --repo DALI951/pinpulse-releases \
              --title "${TITLE}" \
              --notes "${NOTES}"
          fi
