<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PinPulse Master Radar — Global Live Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --panel: #111827;
      --panel-border: #1f293d;
      --primary: #10b981;
      --primary-glow: rgba(16, 185, 129, 0.35);
      --accent: #3b82f6;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: 380px;
      background: var(--panel);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 4px 0 24px rgba(0,0,0,0.5);
    }

    .header {
      padding: 20px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(180deg, #162032 0%, #111827 100%);
    }

    .logo-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .title-group h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .master-tag {
      font-size: 10px;
      font-weight: 700;
      background: #dc2626;
      color: #fff;
      padding: 2px 7px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Live connection banner */
    .status-bar {
      padding: 10px 20px;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }

    .conn-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eab308;
    }
    .status-dot.connected {
      background: var(--primary);
      box-shadow: 0 0 10px var(--primary);
    }
    .status-dot.disconnected {
      background: var(--danger);
    }

    .user-counter {
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent);
      padding: 3px 9px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 11px;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    /* Search */
    .search-bar {
      padding: 14px 20px;
      border-bottom: 1px solid var(--panel-border);
    }
    .search-input {
      width: 100%;
      background: #0b111e;
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-glow);
    }

    /* Users list */
    #user-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .user-card {
      background: #151d2e;
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .user-card:hover {
      background: #1c273e;
      border-color: rgba(59, 130, 246, 0.5);
      transform: translateY(-1px);
    }
    .user-card.active {
      border-color: var(--primary);
      background: #172a38;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.2);
    }

    .card-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #232f48;
      border: 2px solid var(--primary);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      font-size: 16px;
      flex-shrink: 0;
    }
    .card-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info {
      flex: 1;
      min-width: 0;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .badge-live {
      color: var(--primary);
      font-weight: 600;
    }
    .badge-speed {
      background: rgba(255,255,255,0.08);
      padding: 2px 5px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
    }

    /* Map container */
    #map-wrapper {
      flex: 1;
      position: relative;
    }
    #map {
      width: 100%;
      height: 100%;
      background: #090d16;
    }

    /* Map controls */
    .map-style-switcher {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 1000;
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 4px;
      display: flex;
      gap: 4px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .style-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .style-btn.active, .style-btn:hover {
      background: var(--accent);
      color: #fff;
    }

    /* Selected user modal / bottom sheet */
    #person-modal {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 360px;
      background: rgba(17, 24, 39, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 20px;
      z-index: 1000;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6);
      display: none;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .modal-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3px solid var(--primary);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      background: #252836;
      color: #fff;
      box-shadow: 0 0 14px var(--primary-glow);
    }
    .modal-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-name {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }
    .modal-id {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .stat-box {
      background: #111a2c;
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 10px;
    }
    .stat-lbl {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }
    .stat-val {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      margin-top: 2px;
      font-family: 'JetBrains Mono', monospace;
    }

    .nav-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .nav-btn:hover {
      background: #2563eb;
    }

    /* Leaflet custom marker */
    .pinpulse-marker {
      background: transparent;
      border: none;
    }
    .pinpulse-marker-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -50%);
      cursor: pointer;
    }
    .pulse-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.4);
      z-index: 1;
      animation: pulse-wave 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }
    @keyframes pulse-wave {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.8; }
      70% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
    }
    .avatar-bubble {
      position: relative;
      z-index: 2;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid var(--primary);
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      background: #1e293b;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 18px;
    }
    .avatar-bubble img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .name-pill {
      position: relative;
      z-index: 3;
      margin-top: 4px;
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="header">
      <div class="logo-badge">📍</div>
      <div class="title-group">
        <h1>PinPulse <span class="master-tag">Master Radar</span></h1>
        <div class="subtitle">Global Network Monitor • All Devices</div>
      </div>
    </div>

    <div class="status-bar">
      <div class="conn-status">
        <span class="status-dot" id="conn-dot"></span>
        <span id="conn-text">Connecting to Live Broker...</span>
      </div>
      <div class="user-counter" id="active-count">0 Live</div>
    </div>

    <div class="search-bar">
      <input type="text" class="search-input" id="search-box" placeholder="Search user name or ID..." />
    </div>

    <div id="user-list">
      <div style="padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 13px;">
        Listening for devices transmitting GPS...
      </div>
    </div>
  </aside>

  <!-- Map Canvas -->
  <div id="map-wrapper">
    <div class="map-style-switcher">
      <button class="style-btn active" onclick="setMapLayer('streets')">Streets</button>
      <button class="style-btn" onclick="setMapLayer('satellite')">Satellite</button>
      <button class="style-btn" onclick="setMapLayer('hybrid')">Hybrid</button>
    </div>

    <div id="map"></div>

    <!-- Selected Person Floating Card -->
    <div id="person-modal">
      <div class="modal-header">
        <div class="modal-avatar" id="m-avatar">?</div>
        <div>
          <div class="modal-name" id="m-name">User</div>
          <div class="modal-id" id="m-id">ID: ---</div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-lbl">Live Speed</div>
          <div class="stat-val" id="m-speed">0 km/h</div>
        </div>
        <div class="stat-box">
          <div class="stat-lbl">Status</div>
          <div class="stat-val" id="m-status" style="color: var(--primary);">Live</div>
        </div>
        <div class="stat-box" style="grid-column: span 2;">
          <div class="stat-lbl">Coordinates</div>
          <div class="stat-val" id="m-coords" style="font-size: 12px;">36.8065, 10.1815</div>
        </div>
      </div>

      <a id="m-nav-link" href="#" target="_blank" class="nav-btn">
        🚀 Open in Google Maps Turn-by-Turn
      </a>
    </div>
  </div>

  <script>
    var users = {};
    var markers = {};
    var selectedUserId = null;
    var map;
    var currentLayer;

    var layers = {
      streets: L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20 }),
      satellite: L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 20 }),
      hybrid: L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20 })
    };

    function init() {
      map = L.map('map', {
        center: [36.8065, 10.1815],
        zoom: 12,
        zoomControl: false
      });
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      currentLayer = layers.streets;
      currentLayer.addTo(map);

      map.on('click', function() {
        document.getElementById('person-modal').style.display = 'none';
        selectedUserId = null;
        renderUserList();
      });

      connectMqtt();
      setupSearch();
    }

    function setMapLayer(name) {
      document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      map.removeLayer(currentLayer);
      currentLayer = layers[name];
      currentLayer.addTo(map);
    }

    function connectMqtt() {
      var brokerWs = 'wss://broker.emqx.io:8084/mqtt';
      var clientId = 'pinpulse_master_radar_' + Math.random().toString(16).substring(2, 8);

      var client = mqtt.connect(brokerWs, {
        clientId: clientId,
        clean: true,
        reconnectPeriod: 2000
      });

      client.on('connect', function() {
        document.getElementById('conn-dot').className = 'status-dot connected';
        document.getElementById('conn-text').textContent = 'Live Global Relay Active';
        // Wildcard subscribe: catches every single user's location packet!
        client.subscribe('pinpulse/v1/user/+/loc', function(err) {
          if (!err) console.log('Subscribed to all users worldwide on pinpulse/v1/user/+/loc');
        });
      });

      client.on('error', function(err) {
        console.error('MQTT Error:', err);
        document.getElementById('conn-dot').className = 'status-dot disconnected';
        document.getElementById('conn-text').textContent = 'Connection Error (retrying)';
      });

      client.on('message', function(topic, payload) {
        try {
          var data = JSON.parse(payload.toString());
          handleUserPacket(data);
        } catch (e) {
          console.error('Parse error:', e);
        }
      });
    }

    function handleUserPacket(data) {
      if (!data || !data.userId) return;
      var id = data.userId;
      users[id] = {
        id: id,
        name: data.displayName || 'User ' + id.substring(0, 5),
        avatar: data.avatarBase64 || null,
        lat: parseFloat(data.latitude),
        lng: parseFloat(data.longitude),
        speed: data.speedKmh || 0,
        isSharing: data.isSharingLocation !== false,
        timestamp: data.timestamp || Date.now()
      };

      updateMarker(users[id]);
      renderUserList();

      if (selectedUserId === id) {
        showUserModal(users[id]);
      }
    }

    function updateMarker(u) {
      if (isNaN(u.lat) || isNaN(u.lng) || (u.lat === 0 && u.lng === 0)) return;

      var isLive = (Date.now() - u.timestamp < 60000) && u.isSharing;
      var avatarContent = (u.avatar && u.avatar.length > 10)
        ? '<img src="' + u.avatar + '" />'
        : u.name.charAt(0).toUpperCase();

      var iconHtml = '<div class="pinpulse-marker-wrapper" onclick="selectUser(\'' + u.id + '\')">' +
                       (isLive ? '<div class="pulse-ring"></div>' : '') +
                       '<div class="avatar-bubble">' + avatarContent + '</div>' +
                       '<div class="name-pill">' + u.name + '</div>' +
                     '</div>';

      var customIcon = L.divIcon({
        className: 'pinpulse-marker',
        html: iconHtml,
        iconSize: [60, 75],
        iconAnchor: [30, 35]
      });

      if (markers[u.id]) {
        markers[u.id].setIcon(customIcon);
        markers[u.id].setLatLng([u.lat, u.lng]);
      } else {
        var marker = L.marker([u.lat, u.lng], { icon: customIcon });
        marker.addTo(map);
        markers[u.id] = marker;
      }
    }

    function selectUser(id) {
      var u = users[id];
      if (!u) return;
      selectedUserId = id;

      map.flyTo([u.lat, u.lng], 16, { duration: 1.2 });
      showUserModal(u);
      renderUserList();
    }

    function showUserModal(u) {
      var modal = document.getElementById('person-modal');
      modal.style.display = 'block';

      document.getElementById('m-name').textContent = u.name;
      document.getElementById('m-id').textContent = 'ID: ' + u.id;
      document.getElementById('m-speed').textContent = Math.round(u.speed) + ' km/h';
      document.getElementById('m-coords').textContent = u.lat.toFixed(6) + ', ' + u.lng.toFixed(6);

      var isLive = (Date.now() - u.timestamp < 60000) && u.isSharing;
      var statusEl = document.getElementById('m-status');
      statusEl.textContent = isLive ? 'Live Now' : 'Last Seen ' + Math.round((Date.now() - u.timestamp) / 1000) + 's ago';
      statusEl.style.color = isLive ? 'var(--primary)' : 'var(--text-muted)';

      var avatarEl = document.getElementById('m-avatar');
      if (u.avatar && u.avatar.length > 10) {
        avatarEl.innerHTML = '<img src="' + u.avatar + '" />';
      } else {
        avatarEl.textContent = u.name.charAt(0).toUpperCase();
      }

      document.getElementById('m-nav-link').href =
        'https://www.google.com/maps/dir/?api=1&destination=' + u.lat + ',' + u.lng;
    }

    function renderUserList() {
      var listEl = document.getElementById('user-list');
      var filter = document.getElementById('search-box').value.toLowerCase();
      var userArr = Object.values(users);

      document.getElementById('active-count').textContent = userArr.length + ' Live';

      if (userArr.length === 0) {
        listEl.innerHTML = '<div style="padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 13px;">' +
                           'Listening for devices transmitting GPS...</div>';
        return;
      }

      var filtered = userArr.filter(u => u.name.toLowerCase().includes(filter) || u.id.toLowerCase().includes(filter));
      
      listEl.innerHTML = filtered.map(u => {
        var isLive = (Date.now() - u.timestamp < 60000) && u.isSharing;
        var activeClass = (selectedUserId === u.id) ? ' active' : '';
        var avatarContent = (u.avatar && u.avatar.length > 10)
          ? '<img src="' + u.avatar + '" />'
          : u.name.charAt(0).toUpperCase();

        return '<div class="user-card' + activeClass + '" onclick="selectUser(\'' + u.id + '\')">' +
                 '<div class="card-avatar">' + avatarContent + '</div>' +
                 '<div class="card-info">' +
                   '<div class="card-title">' + u.name + '</div>' +
                   '<div class="card-sub">' +
                     '<span class="badge-live">' + (isLive ? '● Live' : '○ Offline') + '</span>' +
                     '<span class="badge-speed">' + Math.round(u.speed) + ' km/h</span>' +
                   '</div>' +
                 '</div>' +
               '</div>';
      }).join('');
    }

    function setupSearch() {
      document.getElementById('search-box').addEventListener('input', renderUserList);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
